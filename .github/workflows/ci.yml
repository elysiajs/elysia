name: Build and Test

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    build:
        name: Build and test code
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install packages
              run: bun install

            - name: Test (Bun + types + Node)
              run: bun run test

            - name: Test (Cloudflare)
              run: bun run test:cf

            - name: Stress benchmark invariants
              run: bun run bench:quick -- --out trace/stress-results.json

            - name: Upload stress benchmark report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: stress-${{ runner.os }}-${{ github.sha }}
                  path: trace/stress-results.json

            - name: Publish Preview
              if: github.event_name == 'pull_request'
              run: bunx pkg-pr-new publish

    benchmark:
        name: Benchmark
        runs-on: ubuntu-latest

        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install packages
              run: bun install

            - name: Benchmark report
              run: bun run example/stress/ci-report.ts --json-out trace/bench-report.json --md-out trace/bench-report.md

            - name: Append report to step summary
              if: always()
              run: cat trace/bench-report.md >> "$GITHUB_STEP_SUMMARY"

            - name: Upload benchmark report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: bench-${{ runner.os }}-${{ github.sha }}
                  path: |
                      trace/bench-report.json
                      trace/bench-report.md

            - name: Comment benchmark report on PR
              if: always() && github.event_name == 'pull_request'
              continue-on-error: true
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs')

                      const marker = '<!-- elysia-bench-report -->'
                      const report = fs.readFileSync('trace/bench-report.md', 'utf8')

                      let body = `${marker}\n## Benchmark report for ${context.payload.pull_request.head.sha}\n\n${report}`
                      if (body.length > 60000)
                          body = body.slice(0, 59950) + '\n\n> (truncated)'

                      const comments = await github.paginate(
                          github.rest.issues.listComments,
                          {
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: context.issue.number,
                              per_page: 100
                          }
                      )

                      const existing = comments.find((comment) =>
                          comment.body?.startsWith(marker)
                      )

                      if (existing)
                          await github.rest.issues.updateComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              comment_id: existing.id,
                              body
                          })
                      else
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: context.issue.number,
                              body
                          })
