name: Build and Test

on:
    push:
    pull_request:

jobs:
    build:
        name: Build and test code
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install packages
              run: bun install

            - name: Test (Bun + types + Node)
              run: bun run test

            - name: Test (Cloudflare)
              run: bun run test:cf

            - name: Stress benchmark invariants
              run: bun run bench:quick -- --out trace/stress-results.json

            - name: Upload stress benchmark report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: stress-${{ runner.os }}-${{ github.sha }}
                  path: trace/stress-results.json

            - name: Publish Preview
              if: github.event_name == 'pull_request'
              run: bunx pkg-pr-new publish
